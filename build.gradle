plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
    id "org.jetbrains.kotlin.plugin.spring" version '2.4.0'
    id 'com.epages.restdocs-api-spec' version '0.20.1'
}

group = 'com.devmind'
version = '0.0.1-SNAPSHOT'
description = 'energy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.mockk:mockk:1.13.12'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

def snippetsDir = file("$buildDir/generated-snippets")

tasks.named('test') {
    useJUnitPlatform()
    outputs.dir snippetsDir
    finalizedBy 'openapi3'
}

openapi3 {
    title = 'Energy API'
    description = 'REST API documentation generated from Spring REST Docs snippets'
    version = project.version
    format = 'yaml'
    server = 'http://localhost:8085'
}

tasks.register('copyOpenapiSpec', Copy) {
    dependsOn 'openapi3'
    from("$buildDir/api-spec")
    include('openapi3.yaml')
    into("$buildDir/resources/main/static")
}

tasks.matching { it.name == 'openapi3' }.configureEach {
    finalizedBy tasks.named('copyOpenapiSpec')
}
